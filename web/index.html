<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>MemoPet · 递归状态电子宠物</title>
  <script>
    (() => {
      const saved = localStorage.getItem("memopet-theme");
      const prefersDark = window.matchMedia("(prefers-color-scheme: dark)").matches;
      document.documentElement.dataset.theme = saved || (prefersDark ? "dark" : "light");
    })();
  </script>
  <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 96 96'%3E%3Cpolygon points='30,26 24,5 43,17' fill='%23f7b955'/%3E%3Cpolygon points='66,26 72,5 53,17' fill='%23f7b955'/%3E%3Ccircle cx='48' cy='46' r='30' fill='%23f7b955'/%3E%3Ccircle cx='38' cy='44' r='3.5' fill='%234a3520'/%3E%3Ccircle cx='58' cy='44' r='3.5' fill='%234a3520'/%3E%3C/svg%3E">
  <link rel="stylesheet" href="style.css?v=0.7">
</head>
<body>
  <header id="top">
    <div class="logo">memo<span>pet</span></div>
    <button id="btn-theme" title="切换亮/暗主题" aria-label="切换亮/暗主题">🌙</button>
    <span id="status" class="dot-off" title="服务状态">●</span>
  </header>

  <main>
    <aside id="slots-panel">
      <div class="panel-title">猫窝</div>
      <div id="slot-list"></div>
      <div class="create-row">
        <input id="new-name" placeholder="起个名字" maxlength="16">
        <select id="new-persona" title="出生人格（初始大脑）"></select>
        <button id="btn-create">领养</button>
        <button id="btn-import" class="ghost" title="导入朋友送的 .pt 存档">📥 导入</button>
        <input type="file" id="import-file" accept=".pt" hidden>
      </div>
    </aside>

    <section id="stage-panel">
      <div id="stage-head">
        <div class="head-info">
          <div id="pet-name">还没有猫</div>
          <div id="pet-meta" class="muted"></div>
        </div>
        <div class="head-tools">
          <button id="btn-export" title="导出存档：把这只猫的完整大脑送给朋友">⬇️</button>
          <button id="btn-fork" title="分身：复制此刻的大脑状态为新宠物">🧬</button>
          <button id="btn-delete" class="danger" title="放归：删除它的记忆张量（无法找回）">🙏</button>
        </div>
      </div>

      <div id="habitat">
        <div id="pet-emoji">🐱</div>
        <div id="bubble" class="hidden"></div>
      </div>

      <div id="meters">
        <div class="meter-row"><span>🍖 饱食</span><div class="bar"><div id="bar-hunger"></div></div></div>
        <div class="meter-row"><span>😺 心情</span><div class="bar"><div id="bar-mood"></div></div></div>
      </div>

      <div id="actions">
        <button data-act="feed">🍖<span>喂食</span></button>
        <button data-act="play">🎾<span>玩耍</span></button>
        <button data-act="pet">🐾<span>摸摸</span></button>
        <button data-act="scold">🙀<span>责骂</span></button>
      </div>

      <form id="chat-row">
        <input id="chat-input" placeholder="跟它说点什么…" maxlength="200" autocomplete="off">
        <button type="submit" title="发送">➤</button>
      </form>
    </section>

    <aside id="diary-panel">
      <div class="panel-title">日记本</div>
      <div id="diary-list"></div>
    </aside>
  </main>
  <script src="app.js?v=0.4"></script>
</body>
</html>
