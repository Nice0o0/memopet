name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Ruff
        run: |
          pip install ruff
          ruff check memopet tests
      - name: Compile check
        run: python -m compileall memopet
      - name: Tests (pure logic, no GPU)
        run: |
          pip install pytest
          pytest -q tests
